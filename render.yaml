services:
  - type: web
    name: atelierflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/atelierflow.db
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/data/uploads

